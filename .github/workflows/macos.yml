name: Build macOS app and portable

on:
  push:
    branches: [main, macos]
  pull_request:
    branches: [main, macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build Minify with web UI and plugins
        run: |
          uv sync --locked
          npm --prefix Minify/ui/web ci
          uv run --no-sync python scripts/build.py
      - name: Test first-run setup without Steam or Wine
        run: |
          uv run --no-sync pytest -q
          scripts/macos/test-fetch-verified
          scripts/macos/test-prepare-wine
          scripts/macos/test-prepare-dxvk
          scripts/macos/test-prepare-workshop
          scripts/macos/test-check-workshop
      - name: Package and smoke-test both extracted archives
        run: scripts/macos/package.sh "${{ matrix.arch }}"
      - name: Upload the Finder app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: scripts/dist/Minify-app-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: scripts/dist/Minify-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
